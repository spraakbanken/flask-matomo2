[project]
name = "flask-matomo2"
version = "0.7.0"
description = "Track requests to your Flask server with Matomo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Språkbanken Text", email = "sb-info@svenska.gu.se" },
  { name = "Lucas Hild", email = "contact@lucas-hild.de" },
]
maintainers = [
  { name = "Språkbanken Text", email = "sb-info@svenska.gu.se" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "flask>=2.3",
  "httpx2>=2.12.0",
  "matomo-core>=0.3.4",
  "werkzeug>=2.3.2",
]

[project.urls]
Changelog = "https://github.com/spraakbanken/flask-matomo2/blob/main/CHANGELOG.md"
Documentation = "http://flask-matomo2.readthedocs.io/"
Homepage = "https://spraakbanken.gu.se"
Issues = "https://github.com/spraakbanken/flask-matomo2/issues"
Repository = "https://github.com/spraakbanken/flask-matomo2"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.16.6",
  "syrupy>=6.0.0",
  "ty>=0.0.79",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
reportGeneralTypeIssues = "none"

[tool.uv]
exclude-newer = "P7D"
